{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Password retrieval</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="{% static 'js/jquery-3.2.1.min.js' %}"></script>
    <link rel="stylesheet" type="text/css" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/font-awesome.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/material-design-iconic-font.min.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/util.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/css.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'css/styleMain.css' %}"/>
</head>
<body>
<!-- loader -->
<div id="loader">
    <img src="{% static 'img/loading-icon.png' %}" alt="icon" class="loading-icon">
</div>
<!-- * loader -->

<!-- App Header -->
<div class="appHeader no-border transparent position-absolute">
    <div class="left">
        <a href="#" class="headerButton goBack">
            <ion-icon name="chevron-back-outline"></ion-icon>
        </a>
    </div>
    <div class="pageTitle"></div>
    <div class="right">
        <a href={% url 'loginModule:loginPage' %} class="headerButton">
            Login
        </a>
    </div>
</div>
<!-- * App Header -->

<!-- App Capsule -->
<div id="appCapsule"
     style="margin: auto; max-width: 500px; border-radius: 10px; width: 95%; background-color: white; position: relative;margin-top: 4%;height: auto !important;
    top: 5%;">

    <div class="section mt-2 text-center">
        <h1>Password retrieval</h1>
    </div>
    <div class="section mb-5 p-2">
        <form class="login100-form validate-form"
              action="#"
              method="post" id="ctUp">
            <div class="wrap-input100 validate-input m-b-21" data-validate="create input your account">
                <span class="label-input100">Email account</span>
                <input class="input100" type="email" name="userEmail" id="userEmail" placeholder="Input your email account"
                       autocomplete="off" maxlength="40" >
                <span class="focus-input100" data-symbol="&#xf206;"></span>
            </div>
            <div class="wrap-input100 validate-input m-b-21" data-validate="input your verification code">
                <span class="label-input100">Code</span>
                <div class="item">
                    <input class="input100" style="width: 65%;display: inline-block" type="number" name="authCode"
                           placeholder="input your code here" maxlength=6 autocomplete="off" required>
                    <button type="button" id="btnSend" class="btn btn-primary btn-sm"
                            style="float:right;margin-top:15px;">Send the code
                    </button>
                    <span class="focus-input100" data-symbol="&#xf110;"></span>
                </div>
            </div>
            <div class="wrap-input100 validate-input m-b-21" data-validate="please input your account">
                <span class="label-input100">Password</span>
                <input class="input100" type="password" id="userPwd" name="userPwd" placeholder="please input your password" maxlength=20
                       autocomplete="off" value="" required>
                <span class="focus-input100" data-symbol="&#xf190;"></span>
            </div>
            <div class="wrap-input100 validate-input" data-validate="please repeat your password">
                <span class="label-input100">Repeat your password</span>
                <input class="input100" type="password" id="userRepeatPwd" name="userRepeatPwd" placeholder="please repeat your password" autocomplete="off" maxlength=20
                       value="" required>
                <span class="focus-input100" data-symbol="&#xf190;"></span>
            </div>


            <div style="margin-top: 40px;">
                <button type="submit" class="btn btn-primary btn-block btn-lg">Sign up</button>
            </div>
        </form>
    </div>
</div>
<!-- * App Capsule -->

<script src="{% static 'js/base.js' %}"></script>

<script type="text/javascript">
    $(function () {
        $("#userRepeatPwd").on("blur", function () {
            if ($("#userRepeatPwd").val() !== $("#userPwd").val()) {
                alert("the two passwords are inconsistent");
                $("#userPwd").val("");
                $("#userRepeatPwd").val("");
            }
        });
    });
  $('#btnSend').on('click', function () {
    const userEmail = $('#userEmail').val();
    if (!userEmail) {
      alert("Please enter your email.");
      return;
    }

    $.ajax({
      url: '/sendEmail/',
      type: 'POST',
      data: { userEmail: userEmail },
      success: function (response) {
        alert(response.message);
      },
        {#campus network might send fail#}
      error: function (xhr) {
        const response = xhr.responseJSON;
        alert(response?.message || "An error occurred.");
      }
    });
  });
</script>

</body>
</html>
