<input
  type="{{ field.type|default:'text' }}"
  name="{{ field.name }}"
  id="{{ field.id|default:field.name }}"
  class="form-control"
  value="{{ field.value|default:'' }}"
  placeholder="{{ field.placeholder|default:'' }}"
  {% if field.required %}required{% endif %}
  {% if field.disabled %}disabled{% endif %}
/>
