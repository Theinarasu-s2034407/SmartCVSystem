{% load static %}
<nav class="navbar navbar-expand-lg navbar-light bg-light px-3">
  <div class="container-fluid">
    <!-- Brand -->
      <img
          src="{% static 'img/favicon.png' %}"
          alt="SmartCV"
          height="60"
        />
    <a class="navbar-brand" href="/dashboard">
      {{ site_name }}
    </a>

    <!-- Toggler -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNav"
      aria-controls="mainNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Collapsible content -->
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-center">
        {% if request.session.user_id %}
        <!-- Dashboard Link -->
        <li class="nav-item me-3">
          <a class="nav-link" href="{% url 'profiles:dashboard' %}">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle p-0 d-flex align-items-center"
            href="#"
            id="userMenu"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <img
            src="{% static 'img/default-avatar.png' %}"
              alt="Avatar"
              class="rounded-circle"
              width="32"
              height="32"
            />
          </a>
          <ul
            class="dropdown-menu dropdown-menu-end"
            aria-labelledby="userMenu"
          >
            <li>
              <a class="dropdown-item" href="{% url 'profiles:profile_edit' %}">
                <i class="bi bi-person-circle me-2"></i>Profile
              </a>
            </li>
            <li>
              <a
                class="dropdown-item"
                href="{% url 'profiles:change_password' %}"
              >
                <i class="bi bi-lock-fill me-2"></i>Change Password
              </a>
            </li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <a
                class="dropdown-item text-danger"
                href="{% url 'authx:logout' %}"
              >
                <i class="bi bi-box-arrow-right me-2"></i>Logout
              </a>
            </li>
          </ul>
        </li>
        {% else %}
        <!-- Logged out links -->
        <li class="nav-item me-2">
          <a class="btn btn-outline-primary" href="{% url 'authx:login' %}">
            Log In
          </a>
        </li>
        <li class="nav-item">
          <a class="btn btn-primary" href="{% url 'authx:register' %}">
            Register
          </a>
        </li>
        {% endif %}
      </ul>
    </div>
    <!-- /.navbar-collapse -->
  </div>
  <!-- /.container-fluid -->
</nav>
